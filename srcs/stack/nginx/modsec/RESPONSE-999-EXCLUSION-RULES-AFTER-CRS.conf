# Exclusions locales — WAF ModSecurity / OWASP CRS 4
#
# 920350  "Host header is a numeric IP address"
#
# Notre hébergement ne fournit pas de nom DNS résolvable : le service est joint par
# son adresse IP. Cette règle signale un en-tête Host numérique — indice de scan
# pertinent pour un site public, mais qui décrit ici notre mode d'accès normal.
#
# Elle vaut 3 points, donc elle ne franchissait jamais le seuil de blocage. Son seul
# effet était de rendre "pertinente" chaque requête au sens de SecAuditEngine, et
# donc de journaliser l'intégralité du trafic : 91 entrées sur 97 le 23/10.
#
# À RETIRER dès qu'un nom de domaine est en place.
SecRuleRemoveById 920350
