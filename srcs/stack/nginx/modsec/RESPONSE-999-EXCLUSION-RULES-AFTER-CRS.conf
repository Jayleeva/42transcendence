# Exclusions globales
#
# 920350  "Host header is a numeric IP address"
#
# Notre hébergement ne fournit pas de nom DNS résolvable : le service est joint par
# son adresse IP. Cette règle signale un en-tête Host numérique qui de base est un indice de scan
# pertinent pour un site public, mais qui décrit ici notre mode d'accès normal.
#
# À RETIRER dès qu'on a un DNS fonctionnel est en place.
SecRuleRemoveById 920350
