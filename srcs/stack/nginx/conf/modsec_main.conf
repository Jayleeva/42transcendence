# --- Étape 1 : Extraction depuis l'image complète avec Core Rule Set intégré ---
FROM owasp/modsecurity-crs:nginx AS crs_source

# --- Étape 2 : Votre image finale de production basée sur Nginx stable ---
FROM nginx:stable

# Outils nécessaires pour votre script Vault
RUN apt-get update && apt-get install -y openssl curl jq && rm -rf /var/lib/apt/lists/*

# 1. Récupération du module dynamique ModSecurity pour Nginx
COPY --from=crs_source /etc/nginx/modules/ngx_http_modsecurity_module.so /etc/nginx/modules/

# 2. Récupération des bibliothèques ModSecurity indispensables au module
COPY --from=crs_source /usr/local/modsecurity /usr/local/modsecurity
RUN ln -s /usr/local/modsecurity/lib/libmodsecurity.so.3 /usr/lib/libmodsecurity.so.3 \
    && ldconfig || true

# 3. Extraction de la configuration CRS et du lot complet de règles depuis /etc/nginx/modsec/
RUN mkdir -p /etc/nginx/modsec/rules
COPY --from=crs_source /etc/nginx/modsec/crs-setup.conf /etc/nginx/modsec/crs-setup.conf
COPY --from=crs_source /etc/nginx/modsec/rules/ /etc/nginx/modsec/rules/

# 4. Téléchargement et activation du fichier de configuration recommandé (Mode Blocage)
RUN curl -fsSL https://githubusercontent.com \
    -o /etc/nginx/modsec/modsecurity.conf \
    && sed -i 's/SecRuleEngine DetectionOnly/SecRuleEngine On/' /etc/nginx/modsec/modsecurity.conf \
    && curl -fsSL https://githubusercontent.com \
    -o /etc/nginx/modsec/unicode.mapping

# 5. Injection de vos fichiers de configurations locaux (Maître et Exclusions)
COPY conf/modsec_main.conf /etc/nginx/modsec/main.conf
COPY conf/modsec_exclusions.conf /etc/nginx/modsec/modsec_exclusions.conf

# 6. Votre logique initiale liée à Vault (Inchangée)
COPY conf/nginx.conf /etc/nginx/nginx.conf
COPY ./tool/nginx_script.sh /usr/local/bin/nginx_script.sh
RUN chmod +x /usr/local/bin/nginx_script.sh

ENTRYPOINT [ "/usr/local/bin/nginx_script.sh" ]
CMD [ "nginx", "-g", "daemon off;" ]
