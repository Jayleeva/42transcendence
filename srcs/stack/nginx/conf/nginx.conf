events {}

http {
	server {
		#SSL/TLS Configuration
		listen 443 ssl;
		ssl_protocols TLSv1.2 TLSv1.3;

		resolver 127.0.0.11 valid=30s;
		#SSL CERTIFICATES
		ssl_certificate /etc/nginx/ssl/transcendence.crt;
		ssl_certificate_key /etc/nginx/ssl/transcendence.key;

		# server name
		server_name clmmm.42.fr;
		
		#root and index 
		root /usr/share/html;
		index index.html;

		location / {
			#set $frontend_target ;
			proxy_pass "http://frontend:3000/";

			# En-têtes obligatoires pour l'activation (Upgrade) du protocole WebSocket
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			
			# Sécurité et suivi
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;	
		}

		# --- REQUÊTES API (Reverse Proxy vers le Backend) ---
		location /api/ {
			#set $backend_target ;
			proxy_pass "http://backend:8000/";			
			# En-têtes standards pour transmettre les infos d'origine au backend
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
