events {}

http {
	server {
		#SSL/TLS Configuration
		listen 443 ssl;
		ssl_protocols TLSv1.2 TLSv1.3;

		#SSL CERTIFICATES
		ssl_certificate /etc/nginx/certs/transcendence.crt;
		ssl_certificate_key /etc/nginx/certs/transcendence.key;

		# server name
		server_name clmmm.42.fr;

		#root and index 
		root /usr/share/html;
		index index.html;

		location / {
			try_files $uri $uri/ /index.html;
		}

		# --- REQUÊTES API (Reverse Proxy vers le Backend) ---
		location /api/ {
			proxy_pass http://backend_server;
			
			# En-têtes standards pour transmettre les infos d'origine au backend
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# --- WEBSOCKETS (Pour le Pong en temps réel et le Chat) ---
		# Souvent les routes WS commencent par /ws/ (ex: Django Channels)
		location /ws/ {
			proxy_pass http://backend_server;
			
			# En-têtes obligatoires pour l'activation (Upgrade) du protocole WebSocket
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			
			# Sécurité et suivi
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Augmenter les timeouts pour éviter que Nginx ne coupe les parties de Pong en cours
			proxy_read_timeout 86400s;
			proxy_send_timeout 86400s;
		}

		# --- FICHIERS MÉDIAS / STATIQUES DU BACKEND (Optionnel) ---
		# Si votre backend génère des fichiers (comme des avatars d'utilisateurs)
		location /media/ {
			alias /var/html/media/;
		}
	}
}
