services:
  # web server
  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./stack/nginx
      dockerfile: Dockerfile
    depends_on:
      - vault
      - backend
      - frontend
    networks:
      - frontend-network
    ports:
      - 443:443
    env_file:
      - .env
    volumes:
      - certs_data:/etc/nginx/certs:ro
    restart: always
  # website front
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./stack/frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - frontend-network
    env_file:
      - .env
    restart: always
# website back
  backend:
    container_name: backend
    image: backend
    build:
      context: ./stack/backend
      dockerfile: Dockerfile
    depends_on:
      pgdb:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network
      - vault-network
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      PGSQL_HOST: pgdb
      PGSQL_PORT: 5432
    restart: always
  # database
  pgdb:
    container_name: pgdb
    image: pgdb
    build:
      context: ./stack/pgdb
      dockerfile: Dockerfile
    networks:
      - backend-network
    ports:
      - 5432:5432
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /var/lib/postgresql/data:/home/ubuntu/data/pgdb_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
  # vault
  vault:
    container_name: vault
    image: vault
    build:
      context: ./stack/vault
      dockerfile: Dockerfile
    networks:
      - vault-network
    ports:
      - 8200:8200
    env_file:
      - .env
    environment:
      VAULT_ADDR: "http:127.0.01:8200"
    volumes:
      - vault_data:/vault/file
      - certs_data:/vault/generated_certs
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/config.hcl
    restart: always

networks:
  frontend-network:
    driver: bridge
  backend-network:
  vault-network:

volumes:
  vault_data:
  certs_data:
