services:
  # web server
  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./stack/nginx
      dockerfile: Dockerfile
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence
    ports:
      - 443:443
    env_file:
      - .env
    secrets:
      - Certificate
      - Key
    volumes:
      - pgdb_data: /var/lib/postgresql/data
    restart: always
  # website front
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./stack/frontend
      dockerfile: Dockerfile
    depends_on:
      - pgdb
    networks:
      - transcendence
    env_file:
      - .env
    secrets:
      - DB_credentials
    volumes:
      - pgdb_data: /var/lib/postgresql/data
    restart: always
# website back
  backend:
    container_name: backtend
    image: backend
    build:
      context: ./stack/backend
      dockerfile: Dockerfile
    depends_on:
      - pgdb
    networks:
      - transcendence
    env_file:
      - .env
    secrets:
      - DB_credentials
    volumes:
      - pgdb_data: /var/lib/postgresql/data
    restart: always
  # database
  pgdb:
    container_name: pgdb
    image: postgres:16-alpine
    #build:
    #  context: ./stack/pgdb
    #  dockerfile: Dockerfile
    networks:
      - transcendence
    ports:
      - 5432:5432
    env_file:
      - .env
    #secrets:
    #  - DB_credentials
    volumes:
      - pgdb_data: /var/lib/postgresql/data
      - ./init-scripts: /docker-entrypoint-initdb.d
    restart: always

volumes:
  pgdb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/data/pgdb_data


networks:
  transcendence:
    driver: bridge
  
secrets:
  Certificate:
    file: ../secrets/transcendence.crt
  Key:
    file: ../secrets/transcendence.key
  DB_credentials:
    file: ../secrets/DB_credentials.txt