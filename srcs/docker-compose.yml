services:
  # web server
  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./stack/nginx
      dockerfile: Dockerfile
    depends_on:
      - vault
      - backend
      - frontend
    networks:
      - frontend-network
    ports:
      - 443:443
    env_file:
      - .env
    #secrets:
    #  - Certificate
    #  - Key
    volumes:
      - certs_data:/etc/nginx/certs:ro
    restart: always

  # website front
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./stack/frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - frontend-network
    env_file:
      - .env
    restart: always

  # website back
  backend:
    container_name: backend
    image: backend
    build:
      context: ./stack/backend
      dockerfile: Dockerfile
    depends_on:
      pgdb:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network
      - vault-network
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      PGSQL_HOST: pgdb
      PGSQL_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgdb:5432/${POSTGRES_DB}?schema=public
    restart: always

  # database
  pgdb:
    container_name: pgdb
    image: pgdb
    build:
      context: ./stack/pgdb
      dockerfile: Dockerfile
    networks:
      - backend-network
    env_file:
      - .env
    volumes:
      - pgdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # vault
  vault:
    container_name: vault
    image: vault
    build:
      context: ./stack/vault
      dockerfile: Dockerfile
    networks:
      - vault-network
    env_file:
      - .env
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - vault_data:/vault/file
      - certs_data:/vault/generated_certs
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/config.hcl
    restart: always

networks:
  frontend-network:
    driver: bridge
  backend-network:
  vault-network:

volumes:
  pgdb_data:
  vault_data:
  certs_data:

